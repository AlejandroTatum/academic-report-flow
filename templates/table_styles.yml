# Versioned catalog of approved contextual table styles (issue #13).
#
# This is the executable source of truth: it replaces runtime dependence on
# the private evaluation PDF/body.md that originally proposed the first seven
# styles (TAB-IN-08 was added later, see below). Every entry here is derived once, by hand, from that human review
# artifact; nothing in this repository parses a PDF or reads a private path
# at runtime (spec `test_issue_13_catalog_is_runtime_self_contained`).
#
# Schema (strict — `tools/table_styles.py` rejects anything outside this
# shape, an unapproved ID set, or a missing token/enum value):
#
#   schema_version: 1
#   catalog_version: "<free string, bumped whenever tokens/rules change>"
#   styles:
#     <one of the approved IDs>:
#       label: <human name>
#       deprecated: <bool>
#       priority: <int, lower wins automatic-selection ties; deliberate
#                   extension beyond the four keys the design named, needed
#                   because deterministic selection requires an explicit,
#                   auditable tie-break — see odd/tasks/contextual-table-styles.md>
#       automatic: <bool, optional, default true; false = explicit-override-only:
#                   the style is never a candidate for automatic selection
#                   but a teacher/institution override can still request it>
#       tokens:
#         borders: full_grid | horizontal_only | minimal
#         header: gray_shaded | dark_shaded | institutional_shaded | plain
#         alignment: centered | left | numeric_right
#         padding: generous | standard | compact | minimal
#         density: low | medium | high
#         row_rhythm: uniform | alternating | column_emphasis
#         palette: monochrome | functional_color | accent_color
#         indicators: none | symbol_color
#         caption: above | below
#         notes: below | inline
#       applicability:              # ALL given constraints must hold
#         purposes: [reference | comparison | status | evidence | dense, ...]
#         lengths: [short | long, ...]
#         max_columns: <int>        # optional
#         meanings: [none | comparison | status, ...]   # optional
#         emphasis: [none | column, ...]                # optional
#         density: [low | medium | high, ...]           # optional
#       avoidance:                  # ANY given constraint that matches excludes the style
#         purposes: [...]
#         lengths: [...]
#         meanings: [...]
#         emphasis: [...]
#         density: [...]
#         color_policy: [color | grayscale, ...]
#
# Tokens are derived from the catalog's "Fortalezas"/"Limitaciones" prose;
# applicability/avoidance come from its "Aplicación"/"Evitar cuando" prose.

schema_version: 1
catalog_version: "2026.09.1"

# Approved `[[status:<value>]]` inline markers (authoring convention approved
# 2026-09-22, see odd/tasks/contextual-table-styles.md). Used by TAB-TC-02
# and TAB-ES-06's `indicators: symbol_color` token: an unknown marker value
# blocks rendering rather than being dropped or guessed. Every entry carries
# a symbol AND a label alongside its color, so meaning survives grayscale
# printing and colorblind rendering -- color is never the only signal.
status_indicators:
  ok:
    symbol: "✓"
    color: "#2E7D32"
    label: "OK"
  fail:
    symbol: "✗"
    color: "#C62828"
    label: "Falla"
  warn:
    symbol: "▲"
    # #F9A825 (a brighter amber) only reached 1.97:1 against white --
    # below WCAG 1.4.11's 3:1 minimum for a graphical object. This darker
    # amber reaches 4.24:1 against white / 3.79:1 against the alternating-
    # row tint (see tools/test_table_accessibility.py).
    color: "#B26A00"
    label: "Alerta"
  up:
    symbol: "↑"
    color: "#1565C0"
    label: "Sube"
  down:
    symbol: "↓"
    # #EF6C00 reached only 2.75:1 against the alternating-row tint --
    # below WCAG 1.4.11's 3:1 minimum. This darker rust-orange reaches
    # 6.17:1 against white / 5.51:1 against the tint, and stays luminance-
    # distinct from `ok`'s green (see tools/test_table_accessibility.py).
    color: "#A6420A"
    label: "Baja"

styles:
  TAB-CL-01:
    label: "Clásico académico refinado"
    deprecated: false
    priority: 10
    tokens:
      borders: full_grid
      header: gray_shaded
      alignment: centered
      padding: generous
      density: low
      row_rhythm: uniform
      palette: monochrome
      indicators: none
      caption: above
      notes: below
    applicability:
      purposes: [reference]
      lengths: [short, long]
      max_columns: 4
    avoidance:
      density: [high]
      meanings: [status]
      emphasis: [column]

  TAB-TC-02:
    label: "Técnico funcional con color"
    deprecated: false
    priority: 30
    tokens:
      borders: horizontal_only
      header: dark_shaded
      alignment: numeric_right
      padding: standard
      density: medium
      row_rhythm: uniform
      palette: functional_color
      indicators: symbol_color
      caption: above
      notes: below
    applicability:
      purposes: [reference, comparison, status]
      lengths: [short, long]
    avoidance:
      color_policy: [grayscale]

  TAB-MN-03:
    label: "Minimalista sin rejilla completa"
    deprecated: false
    priority: 20
    tokens:
      borders: minimal
      header: plain
      alignment: left
      padding: standard
      density: low
      row_rhythm: uniform
      palette: monochrome
      indicators: none
      caption: above
      notes: below
    applicability:
      purposes: [reference]
      lengths: [short]
      max_columns: 3
    avoidance:
      lengths: [long]
      meanings: [status]

  TAB-ZB-04:
    label: "Filas cebra"
    deprecated: false
    priority: 5
    tokens:
      borders: horizontal_only
      header: gray_shaded
      alignment: left
      padding: standard
      density: medium
      row_rhythm: alternating
      palette: monochrome
      indicators: none
      caption: above
      notes: below
    applicability:
      purposes: [reference]
      lengths: [long]
    avoidance:
      emphasis: [column]

  TAB-CE-05:
    label: "Énfasis por columna"
    deprecated: false
    priority: 8
    tokens:
      borders: full_grid
      header: gray_shaded
      alignment: centered
      padding: standard
      density: medium
      row_rhythm: column_emphasis
      palette: accent_color
      indicators: none
      caption: above
      notes: below
    applicability:
      purposes: [comparison]
      emphasis: [column]
    avoidance:
      purposes: [dense]

  TAB-ES-06:
    label: "Matriz de estado con indicadores"
    deprecated: false
    priority: 8
    tokens:
      borders: full_grid
      header: gray_shaded
      alignment: centered
      padding: standard
      density: medium
      row_rhythm: uniform
      palette: functional_color
      indicators: symbol_color
      caption: above
      notes: inline
    applicability:
      purposes: [status]
      meanings: [status]
    avoidance:
      purposes: [dense]

  TAB-CC-07:
    label: "Compacto para datos densos"
    deprecated: false
    priority: 10
    tokens:
      borders: full_grid
      header: gray_shaded
      alignment: left
      padding: minimal
      density: high
      row_rhythm: uniform
      palette: monochrome
      indicators: none
      caption: above
      notes: below
    applicability:
      purposes: [dense, reference]
      density: [high]
    avoidance:
      density: [low]

  # Institutional UNL style (added 2026-10). Explicit-override-only: request it
  # per table with `table_styles: {overrides: {tabla-N: TAB-IN-08}}` in
  # report.yml. `automatic: false` keeps it out of automatic selection, so
  # reports without the override render exactly as before; the empty
  # applicability/avoidance let the override apply to any table context.
  TAB-IN-08:
    label: "Institucional UNL"
    deprecated: false
    priority: 50
    automatic: false
    tokens:
      borders: horizontal_only
      header: institutional_shaded
      alignment: left
      padding: standard
      density: medium
      row_rhythm: alternating
      palette: monochrome
      indicators: none
      caption: above
      notes: below
    applicability: {}
    avoidance: {}
